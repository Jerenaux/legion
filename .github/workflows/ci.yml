name: CI - Tests and Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.6

      - name: Install server dependencies
        run: |
          cd server
          bun ci

      - name: Run server tests
        run: |
          cd server
          bun run test --runInBand

      - name: Build server
        run: |
          cd server
          bun run build

      - name: Upload server coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./server/coverage/lcov.info
          flags: server
          name: server-coverage
        continue-on-error: true

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.6

      - name: Install client dependencies
        run: |
          cd client
          bun ci

      - name: Test and typecheck client
        run: |
          cd client
          bun run test --runInBand
          bunx tsc --noEmit

      - name: Build and package Electron client
        run: |
          cd client
          BUILD_TARGET=electron bun run build
          bunx electron-builder --dir --linux
          if bunx asar list release/linux-unpacked/resources/app.asar | rg '\.map$'; then
            echo "Source maps found in packaged application" >&2
            exit 1
          fi
          ../tools/validate_desktop_release.sh
        env:
          NODE_ENV: production

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.6

      - name: Install API dependencies
        run: |
          cd api/functions
          bun ci

      - name: Lint API
        run: |
          cd api/functions
          bun run lint

      - name: Test API
        run: |
          cd api/functions
          bun run test

      - name: Build API
        run: |
          cd api/functions
          bun run build
        env:
          DEPLOY: true

  build-matchmaker:
    name: Build Matchmaker
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.6

      - name: Install matchmaker dependencies
        run: |
          cd matchmaker
          bun ci

      - name: Build matchmaker
        run: |
          cd matchmaker
          bun run build

      - name: Test matchmaker
        run: |
          cd matchmaker
          bun run test
