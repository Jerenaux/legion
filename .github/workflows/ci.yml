name: CI - Tests and Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Run tests for server
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install server dependencies
        run: |
          cd server
          bun ci

      - name: Run server tests
        run: |
          cd server
          bun run test

      - name: Upload server coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: ./server/coverage/lcov.info
          flags: server
          name: server-coverage
        continue-on-error: true

  # Lint and build client
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install client dependencies
        run: |
          cd client
          bun ci

      - name: Build client
        run: |
          cd client
          bun run build
        env:
          NODE_ENV: production

  # Build and lint API
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install API dependencies
        run: |
          cd api/functions
          bun ci

      - name: Lint API
        run: |
          cd api/functions
          bun run lint
        continue-on-error: true

      - name: Build API
        run: |
          cd api/functions
          bun run build
        env:
          DEPLOY: true

  # Build matchmaker
  build-matchmaker:
    name: Build Matchmaker
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install matchmaker dependencies
        run: |
          cd matchmaker
          bun ci

      - name: Build matchmaker
        run: |
          cd matchmaker
          bun run build
