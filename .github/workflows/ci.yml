name: CI - Tests and Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install server dependencies
        run: |
          cd server
          bun ci
          bun audit

      - name: Run server tests
        run: |
          cd server
          bun run test --runInBand

      - name: Build server
        run: |
          cd server
          bun run build

      - name: Upload server coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: ./server/coverage/lcov.info
          flags: server
          name: server-coverage
        continue-on-error: true

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install client dependencies
        run: |
          cd client
          bun ci
          bun audit

      - name: Test and typecheck client
        run: |
          cd client
          bun run test --runInBand
          bunx tsc --noEmit

      - name: Build and package Electron client
        run: |
          cd client
          BUILD_TARGET=electron bun run build
          bunx electron-builder --dir --linux
          if bunx asar list release/linux-unpacked/resources/app.asar | grep -Eq '\.map$'; then
            echo "Source maps found in packaged application" >&2
            exit 1
          fi
          ../tools/validate_desktop_release.sh
        env:
          NODE_ENV: production
          API_URL: ${{ vars.API_URL }}
          GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
          MATCHMAKER_URL: ${{ vars.MATCHMAKER_URL }}

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install API dependencies
        run: |
          cd api/functions
          bun ci
          bun audit

      - name: Lint API
        run: |
          cd api/functions
          bun run lint

      - name: Test API
        run: |
          cd api/functions
          bun run test

      - name: Build API
        run: |
          cd api/functions
          bun run build
        env:
          DEPLOY: true

  build-matchmaker:
    name: Build Matchmaker
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install matchmaker dependencies
        run: |
          cd matchmaker
          bun ci
          bun audit

      - name: Build matchmaker
        run: |
          cd matchmaker
          bun run build

      - name: Test matchmaker
        run: |
          cd matchmaker
          bun run test
