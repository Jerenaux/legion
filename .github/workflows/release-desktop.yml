name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      publish_itch:
        description: Upload validated builds to Itch.io
        type: boolean
        default: false
      upload_steam:
        description: Upload Legion Demo (3996730) to a private Steam branch
        type: boolean
        default: false
      steam_branch:
        description: Existing private Legion Demo beta branch (never public/default)
        type: string
        default: playtest

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            builder_args: --win --x64
            unpacked: win-unpacked
            executable: Legion.exe
          - platform: mac
            os: macos-latest
            builder_args: --mac --universal
            unpacked: mac-universal
            executable: Legion.app/Contents/MacOS/Legion
          - platform: linux
            os: ubuntu-latest
            builder_args: --linux --x64
            unpacked: linux-unpacked
            executable: Legion
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        shell: bash
        run: |
          version=$(node -p "require('./client/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "client/package.json version is not valid SemVer: $version" >&2
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Install client dependencies
        working-directory: client
        run: bun ci
      - name: Test client and Electron shell
        working-directory: client
        run: |
          bun run test --runInBand
          bunx tsc --noEmit
      - name: Build and sign native package
        working-directory: client
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
          GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
          MATCHMAKER_URL: ${{ vars.MATCHMAKER_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN" || { echo 'Missing SENTRY_AUTH_TOKEN for release source maps' >&2; exit 1; }
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [[ -n "${!variable}" ]] || unset "$variable"
          done
          BUILD_TARGET=electron bun run build
          bunx electron-builder ${{ matrix.builder_args }}
      - name: Prepare store directory
        working-directory: client
        shell: bash
        run: |
          mkdir -p release/store-${{ matrix.platform }}
          cp -R release/${{ matrix.unpacked }}/. release/store-${{ matrix.platform }}/
          cp .itch.toml release/store-${{ matrix.platform }}/.itch.toml
      - name: Smoke-test packaged executable
        working-directory: client
        shell: bash
        run: |
          executable="release/store-${{ matrix.platform }}/${{ matrix.executable }}"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            command=(xvfb-run -a "$executable" --no-sandbox)
          else
            command=("$executable")
          fi
          "${command[@]}" > release/smoke-${{ matrix.platform }}.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            cat release/smoke-${{ matrix.platform }}.log
            wait "$pid"
            exit 1
          fi
          kill "$pid"
      - name: Archive store directory
        working-directory: client
        shell: bash
        run: tar -czf release/Legion-${{ matrix.platform }}.tar.gz -C release/store-${{ matrix.platform }} .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Legion-${{ matrix.platform }}
          path: |
            client/release/Legion-${{ matrix.platform }}.tar.gz
            client/release/*.dmg
            client/release/*.zip
            client/release/*.exe
            client/release/*.AppImage
          if-no-files-found: error

  publish-itch:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_itch
    needs: build
    runs-on: ubuntu-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Install official Butler CLI
        run: |
          version=$(curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST)
          curl -fsSL "https://broth.itch.zone/butler/linux-amd64/${version}/archive/default" -o butler.zip
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Validate and upload platform channels
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          version=$(node -p "require('./client/package.json').version")
          for platform in windows mac linux; do
            mkdir -p "store-$platform"
            tar -xzf "artifacts/Legion-$platform.tar.gz" -C "store-$platform"
          done
          butler validate --platform windows --arch amd64 store-windows
          butler validate --platform osx --arch amd64 store-mac
          butler validate --platform linux --arch amd64 store-linux
          butler push store-windows "$ITCH_TARGET:windows" --userversion "$version"
          butler push store-mac "$ITCH_TARGET:mac" --userversion "$version"
          butler push store-linux "$ITCH_TARGET:linux" --userversion "$version"

  upload-steam-private:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.upload_steam
    needs: build
    runs-on: ubuntu-latest
    environment: desktop-release
    concurrency:
      group: steam-demo-upload
      cancel-in-progress: false
    steps:
      - name: Validate private Steam branch
        env:
          STEAM_BRANCH: ${{ inputs.steam_branch }}
        run: |
          if [[ ! "$STEAM_BRANCH" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ || "$STEAM_BRANCH" == "public" || "$STEAM_BRANCH" == "default" ]]; then
            echo "Choose an existing private Legion Demo branch; public/default promotion is manual." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate credential storage
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Restore Steam credentials
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          umask 077
          gcloud secrets versions access latest --secret=STEAM_CONFIG_VDF --project=legion-32c6d --out-file="$RUNNER_TEMP/steam-config.vdf"
          node tools/steam-credentials.cjs prepare "$RUNNER_TEMP/steam-config.vdf"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract Steam depots
        run: |
          for platform in mac windows; do
            mkdir -p "steam-content/$platform"
            tar -xzf "artifacts/Legion-$platform.tar.gz" -C "steam-content/$platform"
          done
      - name: Upload private Legion Demo build
        id: steam-upload
        uses: game-ci/steam-deploy@50f6b29fc64922e19a16d202a88fe199d394b536 # v3.2.1
        env:
          # Reuse the preinstalled executable; leave STEAM_HOME unset so credentials go to $HOME/Steam.
          XDG_DATA_HOME: /root/.local/share
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ env.STEAM_CONFIG_VDF }}
          appId: 3996730
          firstDepotIdOverride: 3996731
          buildDescription: ${{ github.ref_name }}-${{ github.sha }}
          rootPath: steam-content
          depot1Path: mac
          depot2Path: windows
          releaseBranch: ${{ inputs.steam_branch }}
      - name: Preserve updated Steam credentials
        if: always() && steps.steam-upload.outcome != 'skipped'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          UPLOAD_OUTCOME: ${{ steps.steam-upload.outcome }}
        run: |
          # Docker actions map /github/home to this runner-owned directory.
          updated="$RUNNER_TEMP/_github_home/Steam/config/config.vdf"
          if [[ -f "$updated" ]] && node tools/steam-credentials.cjs validate "$updated"; then
            if ! cmp -s "$RUNNER_TEMP/steam-config.vdf" "$updated"; then
              gcloud secrets versions add STEAM_CONFIG_VDF --project=legion-32c6d --data-file="$updated"
            fi
          elif [[ "$UPLOAD_OUTCOME" == success ]]; then
            echo '::error::Steam uploaded, but its reusable login was not preserved.'
            exit 1
          else
            echo '::warning::Steam did not leave a valid login cache; the stored credential was not replaced.'
          fi
