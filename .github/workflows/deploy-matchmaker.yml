name: Deploy Matchmaker to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'matchmaker/**'
      - 'shared/**'
      - '.bun-version'
      - '.github/workflows/deploy-matchmaker.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy Matchmaker
    runs-on: ubuntu-latest
    
    # Only run on main branch pushes (skip PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install matchmaker dependencies
        working-directory: matchmaker
        run: bun ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build \
            -f matchmaker/Dockerfile.prod \
            --build-arg BUN_VERSION="$(<.bun-version)" \
            -t gcr.io/legion-32c6d/matchmaker2:${{ github.sha }} \
            -t gcr.io/legion-32c6d/matchmaker2:latest \
            --platform linux/amd64 \
            .

      - name: Upload exact container source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dynetis-games
          SENTRY_PROJECT: ${{ vars.SENTRY_BACKEND_PROJECT }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN" && test -n "$SENTRY_PROJECT"
          container=$(docker create gcr.io/legion-32c6d/matchmaker2:${{ github.sha }})
          docker cp "$container:/usr/src/app/dist" "$RUNNER_TEMP/matchmaker-dist"
          docker rm "$container"
          matchmaker/node_modules/.bin/sentry-cli sourcemaps upload "$RUNNER_TEMP/matchmaker-dist" --release "legion@$(node -p "require('./client/package.json').version")"

      - name: Push Docker image
        run: |
          docker push gcr.io/legion-32c6d/matchmaker2:${{ github.sha }}
          docker push gcr.io/legion-32c6d/matchmaker2:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy matchmaker2 \
            --image gcr.io/legion-32c6d/matchmaker2:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 3600 \
            --max-instances 1 \
            --min-instances 0 \
            --set-env-vars NODE_ENV=production,SENTRY_RELEASE="legion@$(node -p "require('./client/package.json').version")",API_URL=${{ vars.API_URL }},GAME_SERVER_URL=${{ vars.GAME_SERVER_URL }},CLIENT_ORIGIN=app://legion \
            --set-secrets API_KEY=API_KEY:latest

      - name: Deployment summary
        run: |
          echo "🚀 Matchmaker deployed successfully!"
          echo "Image: gcr.io/legion-32c6d/matchmaker2:${{ github.sha }}"
          echo "Service URL: $(gcloud run services describe matchmaker2 --region=us-central1 --format='value(status.url)')"
