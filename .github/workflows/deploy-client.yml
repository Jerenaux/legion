name: Deploy Client to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'shared/**'
      - 'firebase.json'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy Client
    runs-on: ubuntu-latest
    
    # Only run on main branch pushes (skip PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Install client dependencies
        run: |
          cd client
          bun ci

      - name: Build client
        run: |
          cd client
          bun run build
        env:
          NODE_ENV: production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: legion-32c6d

      - name: Deployment summary
        run: |
          echo "🚀 Client deployed successfully to Firebase Hosting!"
          echo "Live URL: https://legion-32c6d.web.app"
