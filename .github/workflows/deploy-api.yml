name: Deploy API to Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'shared/**'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - '.bun-version'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    
    # Only run on main branch pushes (skip PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install API dependencies
        run: |
          cd api/functions
          bun ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Firestore indexes
        run: node api/functions/node_modules/firebase-tools/lib/bin/firebase.js deploy --only firestore:indexes --project legion-32c6d --non-interactive

      - name: Deploy to Firebase Functions
        # firebase.json's predeploy hook builds and uploads maps exactly once.
        run: |
          test -n "$SENTRY_AUTH_TOKEN" && test -n "$SENTRY_BACKEND_PROJECT"
          node api/functions/node_modules/firebase-tools/lib/bin/firebase.js deploy --only functions --project legion-32c6d --non-interactive
        env:
          DEPLOY: true
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_BACKEND_PROJECT: ${{ vars.SENTRY_BACKEND_PROJECT }}

      - name: Deployment summary
        run: |
          echo "🚀 API deployed successfully to Firebase Functions!"
          echo "Functions URL: https://us-central1-legion-32c6d.cloudfunctions.net"
