name: Deploy API to Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'shared/**'
      - 'firebase.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    
    # Only run on main branch pushes (skip PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install API dependencies
        run: |
          cd api/functions
          bun ci

      - name: Lint API
        run: |
          cd api/functions
          bun run lint
        continue-on-error: true

      - name: Build API
        run: |
          cd api/functions
          bun run build
        env:
          DEPLOY: true

      - name: Deploy to Firebase Functions
        uses: w9jds/firebase-action@5edc2e4fb0c08474ccf6cc71b29f49502aae5401 # master 2026-09-02
        with:
          args: deploy --only functions
        env:
          DEPLOY: true
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deployment summary
        run: |
          echo "🚀 API deployed successfully to Firebase Functions!"
          echo "Functions URL: https://us-central1-legion-32c6d.cloudfunctions.net"
