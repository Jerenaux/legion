name: Deploy Server to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'shared/**'
      - '.bun-version'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy Server
    runs-on: ubuntu-latest
    
    # Only run on main branch pushes (skip PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install server dependencies
        run: |
          cd server
          bun ci

      - name: Run tests
        run: |
          cd server
          bun run test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build \
            -f server/Dockerfile.prod \
            --build-arg BUN_VERSION="$(<.bun-version)" \
            -t gcr.io/legion-32c6d/server:${{ github.sha }} \
            -t gcr.io/legion-32c6d/server:latest \
            --platform linux/amd64 \
            .

      - name: Push Docker image
        run: |
          docker push gcr.io/legion-32c6d/server:${{ github.sha }}
          docker push gcr.io/legion-32c6d/server:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy server \
            --image gcr.io/legion-32c6d/server:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 3600 \
            --max-instances 1 \
            --min-instances 0 \
            --set-env-vars NODE_ENV=production,API_URL=${{ vars.API_URL }},CLIENT_ORIGIN=app://legion \
            --set-secrets API_KEY=API_KEY:latest

      - name: Deployment summary
        run: |
          echo "🚀 Server deployed successfully!"
          echo "Image: gcr.io/legion-32c6d/server:${{ github.sha }}"
          echo "Service URL: $(gcloud run services describe server --region=us-central1 --format='value(status.url)')"
